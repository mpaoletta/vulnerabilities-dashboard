document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e169dc22-ec44-422d-8db8-03c9c2538271\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ============================================================\n   redbee — Design System\n   Color & Type tokens\n   Source of truth: Manual de marca redbee 2025 + Guía de templates\n   ============================================================ */\n\n/* DM Sans — variable, brand-supplied\n   Local TTFs cover the full opsz/wght axes and italics. */\n@font-face {\n  font-family: 'DM Sans';\n  src: url(\"80f78f74-5c8c-4ebc-8143-3b8a3896a465\") format('truetype-variations'),\n       url(\"80f78f74-5c8c-4ebc-8143-3b8a3896a465\") format('truetype');\n  font-weight: 100 1000;\n  font-stretch: 25% 151%;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'DM Sans';\n  src: url(\"ef2b53d3-738f-4b7b-9f21-8a9658195e09\") format('truetype-variations'),\n       url(\"ef2b53d3-738f-4b7b-9f21-8a9658195e09\") format('truetype');\n  font-weight: 100 1000;\n  font-stretch: 25% 151%;\n  font-style: italic;\n  font-display: swap;\n}\n\n:root {\n  /* ─── COLOR · BRAND ─────────────────────────────────────────\n     Rojo principal is THE dominant brand color.\n     Turquesa & yellow are ACCENT ONLY (never as fill backgrounds).\n  */\n  --rb-red:           #FF0001;   /* Rojo principal — color dominante */\n  --rb-red-dark:      #D41717;   /* Rojo oscuro — variante */\n  --rb-bordo:         #9F0000;   /* Bordó — variante oscura para depth */\n  --rb-teal:          #01BCBA;   /* Turquesa — acento de énfasis */\n  --rb-yellow:        #FFBF00;   /* Amarillo — acento secundario */\n\n  /* ─── COLOR · NEUTRALS ──────────────────────────────────── */\n  --rb-black:         #020202;   /* Negro — fondo de presentaciones (uno de los 4 permitidos) */\n  --rb-near-black:    #020202;   /* alias */\n  --rb-text:          #020202;   /* Cuerpo de texto */\n  --rb-text-muted:    #666660;   /* Texto secundario / labels */\n  --rb-dark:          #373737;   /* Gris oscuro — fondo de slide de sección, títulos sobre tiza */\n  --rb-gray-mid:      #E0E0DE;   /* Bordes, separadores */\n  --rb-gray:          #4A4A47;   /* Gris medio — relleno de figuras geométricas */\n  --rb-gray-light:    #F5F5F3;   /* Card / row background (UI only) */\n  --rb-tiza:          #F1F1EF;   /* \"Tiza\" — fondo permitido en presentaciones */\n  --rb-white:         #FFFFFF;   /* Blanco — fondo permitido en presentaciones */\n\n  /* ─── COLOR · SEMANTIC ROLES ───────────────────────────────\n     Use these in components/slides instead of raw brand colors.\n  */\n  --fg-1:             var(--rb-black);        /* default text */\n  --fg-2:             var(--rb-text);         /* body text */\n  --fg-3:             var(--rb-text-muted);   /* secondary text */\n  --fg-on-red:        var(--rb-white);\n  --fg-on-dark:       var(--rb-white);\n  --fg-accent:        var(--rb-teal);         /* bajadas, números, → flecha */\n  --fg-emphasis:      var(--rb-red);          /* keyword bold, headers en tabla */\n\n  --bg-default:       var(--rb-white);     /* fondo permitido 1 */\n  --bg-secondary:     var(--rb-tiza);      /* fondo permitido 2 */\n  --bg-section:       var(--rb-black);     /* fondo permitido 3 — separador de sección */\n  --bg-portada:       var(--rb-red);       /* fondo permitido 4 — portada */\n  --bg-inverse:       var(--rb-black);\n\n  /* REGLA DE FONDOS EN PRESENTACIONES\n     Solo estos cuatro colores pueden ser fondo de un slide:\n       • var(--rb-red)    #FF0001  — portada / split rojo\n       • var(--rb-black)  #020202  — separador de sección\n       • var(--rb-white)  #FFFFFF  — contenido por defecto\n       • var(--rb-tiza)   #F1F1EF  — alternancia / superficie secundaria  */\n\n  --border-subtle:    var(--rb-gray-mid);\n  --border-strong:    var(--rb-black);\n  --rule-accent:      var(--rb-red);          /* línea corta bajo título */\n\n  /* ─── TIPOGRAFÍA ─────────────────────────────────────────────────\n     Fuente base: DM Sans. Spec: reference/redbee-typography-rules.pdf\n     Pesos disponibles (los SIETE):\n       ExtraLight · Light · Regular · Medium · SemiBold · Bold · Black\n     Variantes itálicas en uso: Italic, Bold Italic, Light Italic\n       (atribución de citas, captions, encabezados de roadmap) */\n  --font-sans: 'DM Sans', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  --fw-extralight: 200;\n  --fw-light:      300;\n  --fw-regular:    400;\n  --fw-medium:     500;\n  --fw-semibold:   600;\n  --fw-bold:       700;\n  --fw-black:      800;\n\n  /* Type scale — derived from the DETAILED rule pages (§1–§11) of\n     reference/redbee-typography-rules.pdf, NOT the summary table.\n     pt → px for the 1280×720 canvas (native slide 720pt wide → ×1.778).\n     Each role lists: pt range (spec) · weight (spec).                */\n\n  /* §1 · PORTADAS */\n  --slide-portada:      112px;  /* Título de portada · 50–70pt · Bold/SemiBold/Medium */\n  --slide-portada-sub:   43px;  /* Subtítulo de portada · 16–40pt · Regular/Medium    */\n  --slide-url:           19px;  /* URL / marca portada · 10–11pt · Regular · MÁX 11pt  */\n\n  /* §2 · SEPARADORES DE SECCIÓN */\n  --slide-section-num:  580px;  /* Número decorativo de sección · 326pt · ExtraLight  */\n  --slide-section-name:  84px;  /* Título de sección · 47pt · Medium                  */\n\n  /* §3 · TITULARES DE CONTENIDO */\n  --slide-statement:     80px;  /* Statement fuerte · 35–55pt · Regular+Bold misma línea */\n  --slide-h1:            41px;  /* Titular de sección de contenido · 23pt · Bold+Regular */\n  --slide-question:      84px;  /* Titular grande / pregunta retórica · 38–54pt · Reg/Bold*/\n\n  /* §4 · SUBTÍTULOS Y ENCABEZADOS DE BLOQUE */\n  --slide-block-sub:     42px;  /* Subtítulo de bloque · 23–25pt · Bold+Medium misma línea*/\n  --slide-lead:          34px;  /* Subtítulo lead/intro TURQUESA · 18–20pt · SemiBold/Med */\n  --slide-label:         20px;  /* Label de sección ALL CAPS · 10–12pt · Bold UPPER      */\n\n  /* §5 · CIFRAS GRANDES Y MÉTRICAS */\n  --slide-kpi:          200px;  /* Cifra hero / KPI · 50–121pt · Light o Bold          */\n  --slide-kpi-2:         64px;  /* Cifra métrica secundaria/resultado · 24–43pt · Bold/Med*/\n  --slide-unit:          36px;  /* Unidad/complemento de cifra · 9–22pt · Med/Reg · proporcional */\n  --slide-table-figure:  39px;  /* Cifra en tabla de impacto · 20–22pt · Bold         */\n\n  /* §6 · TEXTO EN GRÁFICOS Y VISUALIZACIONES */\n  --slide-chart-value:   20px;  /* Porcentajes/valores sobre gráfico · 9–12pt · Med/SemiBold*/\n  --slide-chart-axis:    16px;  /* Labels de ejes/etiquetas de gráfico · 8–10pt · Reg/Med */\n  --slide-node:          21px;  /* Texto en nodos/diagramas de flujo · 10–13pt · Med/SemiBold*/\n\n  /* §7 · BODY / CUERPO DE TEXTO */\n  --slide-body:          23px;  /* Texto corrido principal · 9–13pt · Regular (Bold solo 1–2 conceptos)*/\n  /* §8 · LABELS Y ETIQUETAS DE COMPONENTES */\n  --slide-field-label:   21px;  /* Label de campo dentro de card · 10–12pt · Bold/SemiBold*/  --slide-tag:           16px;  /* Tag de categoría/industria · 9pt · Bold UPPER · separador · */\n  --slide-item-num:      36px;  /* Label de número de ítem/paso · 14–23pt · Bold      */\n\n  /* §9 · QUOTES Y CITAS */\n  --slide-quote:         88px;  /* Cita principal / frase de impacto · 38–55pt · Regular*/\n  --slide-quote-attr:    40px;  /* Atribución de cita · 22pt · Italic                 */\n\n  /* §10 · ROADMAP Y TIMELINES */\n  --slide-roadmap-head:  41px;  /* Encabezado de roadmap · 23pt · Bold Italic + Light Italic*/\n  --slide-period:        25px;  /* Label de período (Q1/Q2) · 14pt · Medium           */\n  --slide-roadmap-item:  18px;  /* Ítem de roadmap · 9–10pt · Bold (nombre)+Regular (desc)*/\n  --slide-roadmap-num:   12px;  /* Numeración de ítem en roadmap · 7pt · Bold         */\n\n  /* §11 · CAPTIONS Y PIES */\n  --slide-caption:       14px;  /* Caption / nota al pie · 7–8pt · Regular o Italic · NIVEL MÁS PEQUEÑO*/\n  --slide-copyright:     18px;  /* Copyright y contacto · 10pt · Regular              */\n\n  --slide-secondary:     18px;  /* Texto secundario · 9–11pt · Regular               */\n\n  /* Back-compat aliases */\n  --slide-display:  var(--slide-portada);\n  --slide-section:  var(--slide-section-num);\n  --slide-comp-sub: 36px;\n  --slide-h2:       var(--slide-comp-sub);\n  --slide-small:    var(--slide-secondary);\n\n  --ui-display: 48px;\n  --ui-h1:      32px;\n  --ui-h2:      24px;\n  --ui-h3:      20px;\n  --ui-body:    15px;\n  --ui-small:   13px;\n  --ui-label:   11px;\n\n  --lh-tight-tightest:  0.8;   /* display / números grandes */\n  --lh-tight:           0.9;   /* titulares — default */\n  --lh-snug:    1.2;\n  --lh-normal:  1.5;\n  --lh-loose:   1.7;\n\n  --tracking-tight: -0.02em;\n  --tracking-snug:  -0.01em;\n  --tracking-wide:   0.08em;   /* labels mayúscula */\n\n  /* ─── SPACING ─────────────────────────────────────────────\n     4px base. Slides use a 1280-wide canvas → ~64px gutter. */\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* Slide canvas — 16:9 at design size */\n  --slide-w: 1280px;\n  --slide-h:  720px;\n  --slide-pad-x: 64px;\n  --slide-pad-y: 56px;\n\n  /* ─── RADII ───────────────────────────────────────────────\n     redbee uses only two radii:\n       --radius-sm (4px) = default; siempre un poco redondeado\n       --radius-pill     = solo para badges / chips / tags\n  */\n  --radius-sm:   4px;\n  --radius-pill: 999px;\n\n  /* ─── SHADOW ──────────────────────────────────────────────\n     redbee no utiliza sombras. Diseño completamente flat —\n     ni en slides, ni en UI. La jerarquía se construye con\n     color, espacio y peso tipográfico. */\n\n  /* ─── BRAND SHAPE TOKENS ──────────────────────────────────\n     The hexagon (pointy-top) is the brand's identity shape.\n     Use as bullet, container, decorative outline.\n  */\n  --hex-clip: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);\n\n  /* ─── BACKGROUND SHAPE TOKENS ─────────────────────────────\n     Figuras geométricas para fondos de slide. Se pueden rellenar\n     con el rojo de marca, negro o cualquier acento — la tipografía\n     encima siempre en contraste. NUNCA degradés. */\n  /* Panel diagonal — borde izquierdo en diagonal (para columna derecha) */\n  --clip-diagonal-right: polygon(22% 0, 100% 0, 100% 100%, 0 100%);\n  /* Panel diagonal — borde derecho en diagonal (para columna izquierda) */\n  --clip-diagonal-left:  polygon(0 0, 100% 0, 78% 100%, 0 100%);\n  /* Panel chevron — punta hacia la derecha a media altura (columna izquierda) */\n  --clip-chevron-right:  polygon(0 0, 86% 0, 100% 50%, 86% 100%, 0 100%);\n  /* Panel chevron — punta hacia la izquierda (columna derecha) */\n  --clip-chevron-left:   polygon(14% 0, 100% 0, 100% 100%, 14% 100%, 0 50%);\n  /* Hexágono flat-top — para panales de equipo (honeycomb) */\n  --hex-clip-flat: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);\n\n  /* ─── MOTION ──────────────────────────────────────────────\n     Subtle. Brand prefers calm, not bouncy. */\n  --ease-standard: cubic-bezier(.2, .0, .0, 1);\n  --ease-emphasis: cubic-bezier(.2, .8, .2, 1);\n  --t-fast:   120ms;\n  --t-normal: 200ms;\n  --t-slow:   320ms;\n}\n\n/* ─── SEMANTIC TEXT STYLES ─────────────────────────────────\n   Spec: reference/redbee-typography-rules.pdf\n   Use as class names: <h1 class=\"rb-h1\">…<\u002Fh1>            */\nhtml { font-family: var(--font-sans); color: var(--fg-1); }\nbody { font-family: var(--font-sans); }\n\n/* Título de portada · 50–70pt · Bold (afirmaciones), SemiBold o Medium (neutro) */\n.rb-display {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--slide-portada);\n  line-height: 0.9;\n  letter-spacing: var(--tracking-snug);\n}\n/* Número decorativo de sección · 326pt · ExtraLight · elemento gráfico */\n.rb-section-num {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-extralight);\n  font-size: var(--slide-section-num);\n  line-height: 0.8;\n  letter-spacing: -0.04em;\n}\n/* Título de sección · 47pt · Medium */\n.rb-section-name {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--slide-section-name);\n  line-height: 0.95;\n  letter-spacing: var(--tracking-snug);\n}\n/* Statement principal de impacto · 35–55pt · Regular + Bold en la misma línea */\n.rb-statement {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--slide-statement);\n  line-height: 0.95;\n  letter-spacing: var(--tracking-snug);\n}\n.rb-statement strong { font-weight: var(--fw-bold); }\n/* Cifra hero / KPI · 50–121pt · Light (volumen) o Bold (énfasis) */\n.rb-kpi {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-light);\n  font-size: var(--slide-kpi);\n  line-height: 0.8;\n  letter-spacing: -0.03em;\n}\n.rb-kpi.is-bold { font-weight: var(--fw-bold); }\n/* Quote de impacto · 38–55pt · Regular */\n.rb-quote {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--slide-quote);\n  line-height: 1.05;\n  letter-spacing: var(--tracking-snug);\n}\n/* Atribución de cita · 22pt · Italic */\n.rb-quote-attr {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-style: italic;\n  font-size: var(--slide-quote-attr);\n  color: var(--fg-3);\n}\n/* Titular de slide de contenido · 23pt · Bold + Regular en la misma línea */\n.rb-h1 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--slide-h1);\n  line-height: 0.95;\n  letter-spacing: var(--tracking-snug);\n  color: var(--fg-1);\n}\n.rb-h1 strong { font-weight: var(--fw-bold); }\n/* Subtítulo de bloque · 23–25pt · Bold + Medium */\n.rb-block-sub {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--slide-block-sub);\n  line-height: 1.1;\n}\n.rb-block-sub strong { font-weight: var(--fw-bold); }\n/* Subtítulo de componente · 20pt · Medium */\n.rb-h2 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--slide-comp-sub);\n  line-height: 1.1;\n  color: var(--fg-1);\n}\n/* Subtítulo lead / intro · 18–20pt · SemiBold o Medium · TURQUESA */\n.rb-lead {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--slide-lead);\n  line-height: var(--lh-snug);\n  color: var(--fg-accent);\n}\n/* Body principal · 12–13pt · Regular (Bold solo para 1–2 conceptos clave) */\n.rb-body {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--slide-body);\n  line-height: var(--lh-normal);\n  color: var(--fg-2);\n}\n.rb-body strong { font-weight: var(--fw-bold); }\n/* Texto secundario · 9–11pt · Regular */\n.rb-small {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--slide-secondary);\n  line-height: var(--lh-normal);\n  color: var(--fg-3);\n}\n/* Caption / pie · 7–8pt · Regular o Italic · nivel más pequeño permitido */\n.rb-caption {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--slide-caption);\n  line-height: var(--lh-normal);\n  color: var(--fg-3);\n}\n.rb-caption.is-italic { font-style: italic; }\n/* Label de campo · 10–12pt · Bold o SemiBold */\n.rb-field-label {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--slide-field-label);\n  color: var(--fg-1);\n}\n/* Label ALL CAPS de sección · 9–10pt · Bold · UPPERCASE */\n.rb-label {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--slide-label);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\n/* Tag de categoría · 9pt · Bold · UPPERCASE · separados por · */\n.rb-tag {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--slide-tag);\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\n/* Copyright · 10pt · Regular */\n.rb-copyright {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--slide-copyright);\n  color: var(--fg-3);\n}\n.rb-num {\n  /* big numbers (01., 02. …) — turquoise accent by default,\n     but any accent or brand red is valid (one color per list) */\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  color: var(--fg-accent);\n  letter-spacing: var(--tracking-snug);\n}\n.rb-keyword {\n  /* the word that gets emphasized inside a title — keep weight bold */\n  font-weight: var(--fw-bold);\n}\n\n/* The signature red rule that sits under a slide title */\n.rb-rule {\n  display: block;\n  width: 72px;\n  height: 2px;\n  background: var(--rule-accent);\n  margin-top: 12px;\n}\n\n/* The signature turquoise → arrow used in lists */\n.rb-arrow::before {\n  content: \"→\";\n  color: var(--fg-accent);\n  font-weight: var(--fw-bold);\n  margin-right: 10px;\n}\n\n/* The hexagon bullet (outline turquoise — uses layered clip-paths because\n   borders on clip-path elements get clipped too and look broken) */\n.rb-hex-bullet {\n  display: inline-block;\n  width: 18px;\n  height: 21px;\n  background: var(--fg-accent);\n  clip-path: var(--hex-clip);\n  position: relative;\n  vertical-align: middle;\n  margin-right: 8px;\n}\n.rb-hex-bullet::after {\n  content: '';\n  position: absolute;\n  inset: 2.5px;\n  background: var(--bg-default);\n  clip-path: var(--hex-clip);\n}\n<\u002Fstyle>\n<script src=\"ddd53ffd-1d68-4f33-b36d-60a009c6d78a\"><\u002Fscript>\n<style>\n:root{--bg:var(--rb-white);--bg2:var(--rb-tiza);--card:var(--rb-white);--line:var(--rb-gray-mid);--line2:var(--rb-tiza);--fg:var(--rb-black);--fg2:var(--rb-dark);--fg3:var(--rb-text-muted);--red:var(--rb-red);--bordo:var(--rb-bordo);--teal:var(--rb-teal);--amber:var(--rb-yellow);--gray:#B9B9B4;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}\n:root[data-theme=\"dark\"]{--bg:#020202;--bg2:#0E0E0E;--card:#0B0B0B;--line:#2A2A28;--line2:#171716;--fg:#FFFFFF;--fg2:#E4E4E0;--fg3:#9A9A94;--gray:#4A4A47;}\n*{box-sizing:border-box;}\nbody{margin:0;background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}\na{color:var(--red);text-decoration:none;}\na:hover{color:var(--bordo);text-decoration:underline;}\ninput[type=checkbox]{accent-color:#FF0001;width:14px;height:14px;cursor:pointer;margin:0;}\n::-webkit-scrollbar{width:10px;height:10px;}\n::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;}\n@keyframes rbpulse{0%,100%{opacity:1}50%{opacity:.25}}\n<\u002Fstyle>\n<script src=\"69ac89ca-9c7d-42c7-ba37-2729c402690c\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif\">\n\n  <header style=\"position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:12px 24px;flex-wrap:wrap\">\n    <img src=\"e42d21d0-77c6-4e37-936c-af37300a0e2e\" alt=\"redbee\" style=\"height:26px;width:auto;display:block\">\n    <div style=\"display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line);padding-left:18px\">\n      <span style=\"font-size:14px;font-weight:700;letter-spacing:-0.01em\">remediación automatizada de vulnerabilidades<\u002Fspan>\n      <span style=\"font-size:10.5px;color:var(--fg3);letter-spacing:0.07em;text-transform:uppercase;font-weight:700\">portfolio · {{ fleetCount }} repositorios · nombres anonimizados<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display:flex;gap:4px;margin-left:6px\">\n      <a href=\"#/dashboard\" style=\"font-size:13px;font-weight:600;padding:7px 13px;border-radius:4px;color:var(--fg)\" style-hover=\"background:var(--bg2)\">Portfolio<\u002Fa>\n      <a href=\"#/remediados\" style=\"font-size:13px;font-weight:600;padding:7px 13px;border-radius:4px;color:var(--fg)\" style-hover=\"background:var(--bg2)\">Remediados<\u002Fa>\n    <\u002Fnav>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:11px;color:var(--fg3);font-weight:600\">\n        <span style=\"display:flex;align-items:center;gap:5px\"><i style=\"width:9px;height:9px;background:var(--teal);border-radius:2px;display:block\"><\u002Fi>hecha<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:5px\"><i style=\"width:9px;height:9px;background:var(--red);border-radius:2px;display:block\"><\u002Fi>corriendo<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:5px\"><i style=\"width:9px;height:9px;background:var(--line);border-radius:2px;display:block\"><\u002Fi>pendiente<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:5px\"><i style=\"width:9px;height:9px;background:var(--line2);border:1px solid var(--line);border-radius:2px;display:block\"><\u002Fi>no aplica<\u002Fspan>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ startGuide }}\" style=\"font-family:inherit;font-size:12px;font-weight:600;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:4px;cursor:pointer\" style-hover=\"border-color:var(--red);color:var(--red)\">Ver guía<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ startKiosk }}\" style=\"font-family:inherit;font-size:12px;font-weight:700;padding:7px 12px;border:none;background:var(--red);color:#fff;border-radius:4px;cursor:pointer\" style-hover=\"background:var(--bordo)\">Mod ponsable&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;QA · m.rodriguez&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    route: (typeof location !== 'undefined' && location.hash) || '#/dashboard',\n    theme: 'light', sortK: 'linesOfCode', sortD: -1,\n    q: '', fType: 'todos', fSize: 'todos', fLang: 'todos', fStage: 'todos',\n    tab: 'deps', sel: {}, selInit: {}, open: {},\n    phRun: {}, phDone: {}, phPct: {}, phMsg: {}, phRes: {}, qa: {}\n  };\n\n  componentDidMount(){\n    this.onHash = () => this.setState({ route: location.hash || '#/dashboard' });\n    window.addEventListener('hashchange', this.onHash);\n    if (!window.RB_DATA) this.poll = setInterval(() => { if (window.RB_DATA) { clearInterval(this.poll); this.forceUpdate(); } }, 60);\n    let qa = {}, th = 'light';\n    try { qa = JSON.parse(localStorage.getItem('rb-qa-v2') || '{}'); th = localStorage.getItem('rb-theme') || this.props.temaInicial || 'light'; } catch(e){}\n    document.documentElement.setAttribute('data-theme', th);\n    this.setState({ qa, theme: th });\n    if ((location.hash || '').indexOf('#/tour') === 0) setTimeout(() => { location.hash = '#/dashboard'; this.tourStart(true); }, 400);\n  }\n  componentWillUnmount(){\n    window.removeEventListener('hashchange', this.onHash);\n    if (this.poll) clearInterval(this.poll);\n    Object.keys(this.timers || {}).forEach(k => clearInterval(this.timers[k]));\n    this.tourUnbind();\n  }\n\n  // ---------- format ----------\n  n(v){ return (v || 0).toLocaleString('es-AR'); }\n  t(sec){\n    const s = Math.max(0, Math.round(sec));\n    if (!s) return '—';\n    if (s < 60) return s + 's';\n    const m = Math.round(s/60);\n    if (m < 60) return m + 'm';\n    const h = Math.floor(m/60);\n    return h >= 24 ? this.n(h) + 'h' : h + 'h ' + String(m%60).padStart(2,'0') + 'm';\n  }\n  usd(v){ return 'USD ' + (v || 0).toFixed(2).replace('.', ', ow ? row.compileTimeSeconds || 0 : 0;\n    const it = this.itemsFor(slug), sel = this.selFor(slug), O = M.phaseOverheadSeconds;\n    const UD = row.unitDetail || { sastFiles:0, secretTypes:0, secretFiles:0 };\n\n    // fixdeps: los updates de niveles 1-3 vienen completos en el JSON, se cuentan uno a uno\n    const depSel = it.deps.filter(d => sel[d.id]);\n    let depT = 0, depC = 0;\n    depSel.forEach(d => {\n      if (d.requiresCodeChange) { depT += M.fixdeps.codeChangeSeconds + M.fixdeps.codeChangeCompileFactor*C; depC += M.fixdeps.codeChangeUsd; }\n      else { depT += M.fixdeps.bumpSeconds + M.fixdeps.bumpCompileFactor*C; depC += M.fixdeps.bumpUsd; }\n    });\n    const l4Sel = it.l4.filter(d => sel[d.id]);\n    let l4T = 0, l4C = 0;\n    l4Sel.forEach(d => { l4T += M.fixdeps.codeChangeSeconds + M.fixdeps.codeChangeCompileFactor*C; l4C += M.fixdeps.codeChangeUsd; });\n\n    // fixcode y fixsecrets: el detalle está recortado (meta.caps), así que la base es el\n    // total real del repo y sólo se descuenta lo que el usuario deselecciona entre lo visible\n    const codePairs = {};\n    it.code.forEach(c => {\n      const k = c.fi + '|' + c.sev;\n      if (!codePairs[k]) codePairs[k] = { on:false, real: it.codeReal[k] || 0 };\n      if (sel[c.id]) codePairs[k].on = true;\n    });\n    const codeOff = Object.keys(codePairs).filter(k => !codePairs[k].on);\n    const codeUnits = Math.max(0, UD.sastFiles - codeOff.length);\n    const codeHidden = Math.max(0, UD.sastFiles - Object.keys(codePairs).length);\n    const codeFixes = Math.max(0, row.vulnerabilities.code - codeOff.reduce((a,k) => a + codePairs[k].real, 0));\n    const codeT = codeUnits ? codeUnits * (M.fixcode.secondsPerFile + M.fixcode.compileFactor*C) + O : 0;\n    const codeC = codeUnits * M.fixcode.usdPerFile;\n\n    const secFileMap = {}, secTypeMap = {};\n    it.secrets.forEach(k => {\n      if (!k.fp) {\n        if (!secFileMap[k.fi]) secFileMap[k.fi] = { on:false, real: it.secretReal[k.fi] || 0 };\n        if (sel[k.id]) secFileMap[k.fi].on = true;\n      }\n      if (!secTypeMap[k.tipo]) secTypeMap[k.tipo] = false;\n      if (sel[k.id]) secTypeMap[k.tipo] = true;\n    });\n    const secFilesOff = Object.keys(secFileMap).filter(f => !secFileMap[f].on);\n    const secTypesOff = Object.keys(secTypeMap).filter(t => !secTypeMap[t]);\n    const secFileUnits = Math.max(0, UD.secretFiles - secFilesOff.length);\n    const secTypeUnits = Math.max(0, UD.secretTypes - secTypesOff.length);\n    const secHiddenFiles = Math.max(0, UD.secretFiles - Object.keys(secFileMap).length);\n    const secFixes = Math.max(0, row.vulnerabilities.secretsActive - secFilesOff.reduce((a,f) => a + secFileMap[f].real, 0));\n    const secT = (secFileUnits || secTypeUnits)\n      ? secTypeUnits*M.fixsecrets.triageSecondsPerType + secFileUnits*(M.fixsecrets.secondsPerFile + M.fixsecrets.compileFactor*C) + O : 0;\n    const secC = secTypeUnits*M.fixsecrets.triageUsdPerType + secFileUnits*M.fixsecrets.usdPerFile;\n\n    const ph = [\n      { name:'review', units:'ejecutada', t: row.reviewSeconds || 0, c: row.reviewSeconds ? M.reviewUsd : 0, fixes: 0 },\n      { name:'fixdeps', units: depSel.length + ' de ' + it.deps.length + ' librerías', t: depSel.length ? depT + O : 0, c: depC, fixes: depSel.reduce((a,d)=>a+(d.fixesCount||0),0) },\n      { name:'fixcode', units: this.n(codeUnits) + ' de ' + this.n(UD.sastFiles) + ' unidades (archivo × severidad)', t: codeT, c: codeC, fixes: codeFixes },\n      { name:'fixsecrets', units: secTypeUnits + ' tipos · ' + this.n(secFileUnits) + ' de ' + this.n(UD.secretFiles) + ' archivos', t: secT, c: secC, fixes: secFixes }\n    ];\n    return {\n      ph, total: ph.slice(1).reduce((a,p)=>a+p.t,0), cost: ph.slice(1).reduce((a,p)=>a+p.c,0),\n      depSel, l4Sel, codeSel: it.code.filter(c => sel[c.id]), secSel: it.secrets.filter(k => sel[k.id]),\n      codeUnits, codeHidden, secTypeUnits, secFileUnits, secHiddenFiles,\n      secTypes: Object.keys(secTypeMap).filter(t => secTypeMap[t]), secFiles: Object.keys(secFileMap).filter(f => secFileMap[f].on),\n      l4: { t: l4Sel.length ? l4T + O : 0, c: l4C, fixes: l4Sel.reduce((a,d)=>a+(d.fixesCount||0),0), n: l4Sel.length },\n      fixes: ph[1].fixes + ph[2].fixes + ph[3].fixes, compile: C\n    };\n  }\n\n  ORDER = ['fixdeps','fixcode','fixsecrets'];\n\n  phaseStatus(slug, key){\n    const rk = slug + ':' + key;\n    if (this.state.phDone[rk]) return 'done';\n    if (this.state.phRun[rk]) return 'running';\n    const row = window.RB_DATA.fleet.repositories.filter(r => r.slug === slug)[0];\n    const p = row ? row.demoState.phases.filter(x => x.phase === key)[0] : null;\n    return p ? p.status : 'pending';\n  }\n  blockedBy(slug, key){\n    const i = this.ORDER.indexOf(key);\n    for (let n = 0; n < i; n++) {\n      const st = this.phaseStatus(slug, this.ORDER[n]);\n      if (st !== 'done' && st !== 'not-applicable') return this.ORDER[n];\n    }\n    return null;\n  }\n  nextAfter(slug, key){\n    const i = this.ORDER.indexOf(key);\n    for (let n = i + 1; n < this.ORDER.length; n++) {\n      const st = this.phaseStatus(slug, this.ORDER[n]);\n      if (st === 'pending') return this.ORDER[n];\n    }\n    return null;\n  }\n\n  startPhase(slug, key, chain){\n    const k = slug + ':' + key;\n    if (this.state.phRun[k] || this.state.phDone[k]) return;\n    if (this.blockedBy(slug, key)) return;\n    if (this.ORDER.some(p => this.state.phRun[slug + ':' + p])) return;\n    if (chain) this.chain = true;\n    this.timers = this.timers || {};\n    const est = this.estimate(slug), idx = { fixdeps:1, fixcode:2, fixsecrets:3 }[key];\n    const p = est.ph[idx];\n    if (!p.t) return;\n    const snap = { units: p.units, t: p.t, c: p.c, fixes: p.fixes };\n    const labels = {\n      fixdeps: est.depSel.slice(0,4).map((d,i) => 'step ' + (i+1) + '/' + est.depSel.length + ' — ' + d.package),\n      fixcode: Array.from(new Set(est.codeSel.map(c => c.file.split('/').pop()))).slice(0,4),\n      fixsecrets: : 'Smoke test de toda la app', kind: 'transversal', detail: 'build + suite de tests completa' });\n    return out.map((f,i) => Object.assign({ fid: slug + ':' + i }, f));\n  }\n\n  // ================= guía interactiva =================\n  tourState(){ return this.state.tour || { on:false, kiosk:false, i:0, paused:false, elapsed:0, spot:null, bubble:null }; }\n  setTour(patch){ this.setState(st => ({ tour: Object.assign({}, this.tourState(), patch) })); }\n\n  pickDemoRepos(){\n    if (this._demo) return this._demo;\n    const R = window.RB_DATA.fleet.repositories, detail = window.RB_DATA.repositories;\n    const score = r => {\n      const d = detail[r.slug];\n      if (!d) return -1;\n      const swap = (d.dependencies.plan.levels||[]).some(l => (l.updates||[]).some(u => u.targetPackage));\n      return (r.type === 'B' ? 4 : 0) + (r.potential > 0 ? 3 : 0) + (r.vulnerabilities.code > 0 ? 2 : 0)\n        + (r.vulnerabilities.secretsActive > 0 ? 2 : 0) + (swap ? 3 : 0) + ((d.classification.blocking||[]).length ? 2 : 0);\n    };\n    const main = R.slice().sort((a,b) => score(b) - score(a))[0];\n    const topSecret = R.slice().sort((a,b) => b.vulnerabilities.secretsActive - a.vulnerabilities.secretsActive)[0];\n    const remediated = R.filter(r => r.demoState.stage === 'remediated')[0] || R[0];\n    this._demo = { main, topSecret, remediated };\n    return this._demo;\n  }\n\n  tourSteps(){\n    if (this._steps) return this._steps;\n    const D = window.RB_DATA, F = D.fleet, n = v => this.n(v);\n    const dm = this.pickDemoRepos(), main = dm.main, topSecret = dm.topSecret, remediated = dm.remediated;\n    const md = D.repositories[main.slug];\n    const totalV = F.totals.dependencies + F.totals.code + F.totals.secretsActive;\n    const langs = Object.keys(F.distributions.byLanguage).length;\n    const swapLevel = (md.dependencies.plan.levels||[]).filter(l => (l.updates||[]).some(u => u.targetPackage))[0];\n    const swap = swapLevel ? swapLevel.updates.filter(u => u.targetPackage)[0] : null;\n    const b0 = (md.classification.blocking||[])[0];\n    const blockName = b0 ? (typeof b0 === 'string' ? b0 : (b0.packageName || b0.package || b0.name)) : null;\n    const brokenBuilds = F.repositories.filter(r => !r.compiles).length;\n    const worstBaseline = F.repositories.slice().sort((a,b)=>b.testBaselineFailing-a.testBaselineFailing)[0];\n\n    const st = [\n      { act:0, plate:true, seconds:8, title:'Remediación de vulnerabilidades, de punta a punta',\n        body:'Detectar es la parte fácil. Esta herramienta corrige, verifica que no rompió nada, y le dice a QA exactamente qué volver a probar.' },\n      { act:0, seconds:10, route:'#/dashboard', target:'[data-tour=\"kpis\"]', title: F.repositoryCount + ' repositorios, ' + n(totalV) + ' hallazgos',\n        body: langs + ' lenguajes y frameworks distintos: Angular, NestJS, Spring, FastAPI, ASP.NET Core, Swift, Kotlin, Go. Ningún equipo puede con esto a mano.' },\n      { act:0, plate:true, seconds:12, title:'Review → fixdeps → fixcode → fixsecrets',\n        diagram:[['review','var(--teal)'],['fixdeps','var(--red)'],['fixcode','var(--red)'],['fixsecrets','var(--red)']],\n        body:'Review escanea y arma el plan. Las tres fases siguientes lo ejecutan en secuencia: dependencias, código y secretos. Ninguna vuelve a escanear — todas consumen lo que dejó review.' },\n      { act:0, plate:true, seconds:12, title:'Se commitea sólo si queda en verde',\n        diagram:[['aplicar','var(--fg3)'],['compilar','var(--amber)'],['tests','var(--teal)'],['commit','var(--teal)']],\n        body:'Cada unidad de trabajo se aplica, compila y corre los tests. Si el build se rompe, la IA lo arregla. Si aparece una regresión, la IA la arregla. Si igual queda en rojo, esa unidad se descarta y el proceso sigue con la siguiente.' },\n\n      { act:1, seconds:9, route:'#/dashboard', target:'[data-tour=\"kpis\"]', title:'Todo el portfolio en una pantalla',\n        body:'Cuántos repositorios hay, de qué tip file, it.secrets.filter(x => x.fi === fi), x => ({\n          name: 'línea ' + x.line, nameFull: x.file + ':' + x.line,\n          target: x.tipo, targetFull: x.tipo,\n          sev: x.fp ? 'falso pos.' : 'activo', sevBg: x.fp ? 'var(--line)' : 'var(--amber)', sevFg: 'var(--fg)',\n          kind: '', scope: x.verified ? 'verificado' : 'no verificado', info: x.file, infoFull: x.file,\n          flag: '', flagColor:'var(--fg3)', checked: !!sel[x.id], disabled: false,\n          op: x.fp ? '0.5' : '1', strike: x.fp ? 'line-through' : 'none',\n          aria: 'Seleccionar secreto en ' + x.file, toggle: () => this.setSel(slug, [x.id], !sel[x.id])\n        }), f.total > (f.findings||[]).length ? 'se muestran ' + (f.findings||[]).length + ' de ' + this.n(f.total) + ' secretos de este archivo' : ''));\n        if (est.secHiddenFiles > 0) v.groups.push({ title:'Archivos no listados', meta:'incluidos en la estimación', open:true, chev:'▼', count:'', boxMark:'', boxBg:'transparent', boxBd:'var(--fg3)', toggleAll:()=>{}, toggleOpen:()=>{}, rows:[], truncated:true, truncNote: this.n(est.secHiddenFiles) + ' de ' + this.n(row.unitDetail.secretFiles) + ' archivos con secretos activos no aparecen en el detalle, pero cuentan en la estimación (total real: ' + this.n(d.secrets.active) + ' secretos activos).' });\n      }\n\n      const maxT = Math.max.apply(null, est.ph.map(p=>p.t)) || 1;\n      v.estPhases = est.ph.map(p => ({ name:p.name, units:p.units, time: p.t ? this.t(p.t) : '—', cost:this.usd(p.c), w:(p.t/maxT*100)+'%' }));\n      v.hasL4 = it.l4.length > 0;\n      v.l4Label = est.l4.n + ' de ' + it.l4.length + ' seleccionadas · ' + this.t(est.l4.t) + ' · ' + this.usd(est.l4.c);\n      v.estTotalTime = this.t(est.total);\n      v.estTotalCost = this.usd(est.cost);\n      v.estFixed = clean ? '—' : this.n(est.fixes) + ' de ' + this.n(totalVulns);\n      v.estOpen = this.n(totalVulns - est.fixes);\n      v.estFixedW = (est.fixes/(totalVulns||1)*100) + '%';\n      v.estNote = 'Residual sin fix: ' + this.n(row.potential) + ' de dependencias.' + (it.l4.length ? ' El nivel 4 se cuenta aparte.' : '')\n        + (est.codeHidden > 0 ? ' Incluye ' + this.n(est.codeHidden) + ' unidades de código que no aparecen en el detalle.' : '')\n        + (est.secHiddenFiles > 0 ? ' Incluye ' + this.n(est.secHiddenFiles) + ' archivos con secretos que no aparecen en el detalle.' : '');\n      v.compileNote = String(row.compileTimeSeconds).replace('.',',') + ' s';\n\n      const stateOf = k => this.phaseStatus(slug, k);\n      const anyRunning = ['fixdeps','fixcode','fixsecrets'].some(k => S.phRun[slug + ':' + k]);\n      let accT = 0, accC = 0, open = totalVulns;\n      v.phaseCards = ['fixdeps','fixcode','fixsecrets'].map((k, idx) => {\n        const rk = slug + ':' + k, st = stateOf(k);\n        const live = est.ph[idx+1];\n        const ph = (S.phRun[rk] || S.phDone[rk]) && S.phRes[rk] ? S.phRes[rk] : { units: live.units, t: live.t, c: live.c, fixes: live.fixes };\n        const done = st === 'done', running = st === 'running';\n        const pct = done ? 100 : (S.phPct[rk] || (running ? 45 : 0));\n        if (done) { accT += ph.t; accC += ph.c; open -= ph.fixes; }\n        const na = st === 'not-applicable' || !live.t && !ph.t;\n        const blocker = this.blockedBy(slug, k);\n        return {\n          key: k, units: na ? 'sin unidades en este repo' : ph.units,\n          fixes: na ? '—' : this.n(ph.fixes), time: na ? '—' : this.t(ph.t), cost: na ? '—' : this.usd(ph.c),\n          pct: na ? '—' : pct + '%', ring: this.donut(na ? 0 : pct, done ? 'var(--teal)' : 'var(--red)'),\n          stateLabel: na ? 'no aplica' : (done ? 'completado' : (running ? 'en curso' : (blocker ? 'en espera de ' + blocker : 'pendiente'))),\n          stateColor: na ? 'var(--fg3)' : this.phColor(st),\n          barW: (na ? 0 : pct) + '%', msg: S.phMsg[rk] || '',\n          btnLabel: na ? 'Sin trabajo pendiente' : (done ? 'Ejecutada' : (running ? 'Ejecutando… ' + pct + '%' : (blocker ? 'Requiere ' + blocker : 'Ejecutar ' + k))),\n          btnBg: (na || done || blocker) ? 'var(--line2)' : 'var(--red)', btnFg: (na || done || blocker) ? 'var(--fg3)' : '#fff',\n          disabled: na || done || running || !!blocker || anyRunning, run: () => this.startPhase(slug, k)\n        };\n      });\n      v.phasesNote = row.reviewSeconds ? 'review ejecutada en ' + this.t(row.reviewSeconds) + ' · las tres fases siguientes se ejecutan por separado' : 'el review no encontró vulnerabilidades: no hay fases de fix para ejecutar';\n      const allDone = ['fixdeps','fixcode','fixsecrets'].every(k => { const st = stateOf(k); return st === 'done' || st === 'not-applicable'; });\n      v.running = ['fixdeps','fixcode','fixsecrets'].some(k => S.phRun[slug + ':' + k]);\n      v.runLabel = allDone ? 'Remediación completa' : (v.running ? 'Ejecutando en secuencia…' : 'Ejecutar las 3 fases en secuencia');\n      v.runAll = () => {\n        const first = ['fixdeps','fixcode','fixsecrets'].filter(k => this.phaseStatus(slug, k) === 'pending')[0];\n        if (first) this.startPhase(slug, first, true);\n      };\n      v.afterStats = [\n        { k:'Estado después de la remediación', v: clean ? 'nada para remediar' : (allDone ? 'PR abierto · pendiente de QA' : 'en curso'), color: allDone && !clean ? 'var(--teal)' : 'var(--fg3)' },\n        { k:'Vulnerabilidades abiertas', v: clean ? '0' : this.n(open) + ' de ' + this.n(totalVulns), color:'var(--fg)' },\n        { k:'Fix ejecutado (estimado)', v: accT ? this.t(accT) : '—', color:'var(--fg)' },\n        { k:'Costo ejecutado (estimado)', v: accT ? this.usd(accC) : '—', color:'var(--fg)' }\n      ];\n    }\n\n    // ---------- remediados ----------\n    if (isRem) {\n      const list = R.filter(r => r.demoState.stage === 'remediated');\n      const qa = S.qa;\n      let fixedTot = 0, tTot = 0, cTot = 0;\n      v.remRepos = list.map(r => {\n        const fixed = r.vulnerabilities.dependencies - r.potential;\n        fixedTot += fixed; tTot += r.estimate.total.seconds; cTot += r.estimate.total.usd;\n        const flows = this.flowsFor(r.slug);\n        const done = flows.filter(f => qa[f.fid]).length;\n        return {\n          slug: r.slug, href: '#/repo/' + r.slug, tourFlows: 'flows-' + r.slug, type:'TIPO ' + r.type, stack: r.stack,\n          typeBg: this.typeBg(r.type), typeFg: this.typeFg(r.type),\n          depFixed: this.n(fixed), depTotal: this.n(r.vulnerabilities.dependencies),\n          depW: (r.vulnerabilities.dependencies ? fixed/r.vulnerabilities.dependencies*100 : 100) + '%',\n          depRest: r.potential ? this.n(r.potential) + ' residuales sin fix disponible' : 'sin residuales',\n          depRestColor: r.potential ? 'var(--bordo)' : 'var(--fg3)',\n          code: this.n(r.vulnerabilities.code), secrets: this.n(r.vulnerabilities.secretsActive),\n          units: this.n(r.units.fixdeps + r.units.fixcode + r.units.fixsecrets),\n          phases: ['fixdeps','fixcode','fixsecrets'].map(k => ({ name:k, time: this.t(r.estimate[k].seconds), cost: this.usd(r.estimate[k].usd) })),\n          totalTime: this.t(r.estimate.total.seconds), totalCost: this.usd(r.estimate.total.usd),\n          prLabel: 'PR #' + (1200 + (this.hash(r.slug) % 700)),\n          prMeta: this.n(r.units.fixdeps + r.units.fixcode) + ' commits · ' + this.n(r.unitDetail.sastFiles + r.unitDetail.secretFiles) + ' archivos tocados',\n          prBranch: 'remediation/' + r.slug,\n          qaState: done === 0 ? 'pendiente de QA' : (done === flows.length ? 'verificado' : 'verificación parcial'),\n          qaBg: done === 0 ? 'var(--line)' : (done === flows.length ? 'var(--teal)' : 'var(--amber)'),\n          qaFg: done === flows.length && done > 0 ? '#fff' : 'var(--fg)',\n          qaCount: done + ' de ' + flows.length + ' flujos verificados',\n          qaW: (flows.length ? done/flows.length*100 : 0) + '%',\n          flows: flows.map(f => {\n            const rec = qa[f.fid];\n            return {\n              name: f.name, nameFull: f.name, kind: f.kind, detail: f.detail, detailFull: f.detail,\n              checked: !!rec, aria: 'Verificado por QA: ' + f.name,\n              stamp: rec ? (rec.by + ' · ' + rec.at) : 'sin verificar',\n              toggle: () => {\n                const next = Object.assign({}, this.state.qa);\n                if (next[f.fid]) delete next[f.fid];\n                else next[f.fid] = { by: this.props.qaResponsable || 'QA · m.rodriguez', at: new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) };\n                this.saveQa(next);\n              }\n            };\n          })\n        };\n      });\n      v.remSummary = list.length + ' repos · ' + this.n(fixedTot) + ' vulnerabilidades de dependencias corregidas · ' + this.t(tTot) + ' y ' + this.usd(cTot) + ' estimados';\n    }\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
